# Render blueprint. Create the service from this file rather than clicking
# through the dashboard, so the configuration is in version control.
#
# Secrets are marked sync:false — Render prompts for them once and never stores
# them here.

services:
  - type: web
    name: calorie-tracker-api
    runtime: node
    plan: free
    region: oregon

    # Install from the repo root: npm workspaces links @ct/shared into the
    # server package, so installing inside packages/server alone would fail.
    buildCommand: npm ci
    startCommand: npm start --workspace=@ct/server

    # Liveness, not readiness — see routes/health.js. A readiness check here
    # would restart the service in a loop whenever Atlas was unreachable.
    healthCheckPath: /api/health/live

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # The Vercel origin. Only used by the React Native client in Phase 6 and
      # by any direct browser call — the web app goes through Vercel's rewrite.
      - key: CORS_ORIGIN
        sync: false

      # Same-origin via the Vercel rewrite, so lax is correct. Change to 'none'
      # only if the browser calls Render directly.
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"

      - key: OFF_USER_AGENT
        sync: false
